[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teradata-gcfr-mcp-server"
version = "0.1.0"
description = "MCP server exposing Teradata GCFR operational reporting as natural-language tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["teradata", "gcfr", "mcp", "data-warehouse", "elt"]

dependencies = [
    "mcp>=1.0.0",
    "teradatasql>=20.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-mock",
    "pytest-asyncio",
    "types-PyYAML",
]

[project.scripts]
teradata-gcfr-mcp-server = "teradata_gcfr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teradata_gcfr_mcp"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
